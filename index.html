<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <title>Room | Homepage (React)</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- CSS Murni -->
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // ---------- SLIDE DATA ----------
        const slidesData = [
            {
                id: 0,
                title: 'Discover innovative ways to decorate',
                description: `We provide unmatched quality, comfort, and style for property owners across the country. Our experts combine form and function in bringing your vision to life. Create a room in your own style with our collection and make your property a reflection of you and what you love.`,
                desktopImage: './images/desktop-image-hero-1.jpg',
                mobileImage: './images/mobile-image-hero-1.jpg',
            },
            {
                id: 1,
                title: 'We are available all across the globe',
                description: `With stores all over the world, it's easy for you to find furniture for your home or place of business. Locally, we're in most major cities throughout the country. Find the branch nearest you using our store locator. Any questions? Don't hesitate to contact us today.`,
                desktopImage: './images/desktop-image-hero-2.jpg',
                mobileImage: './images/mobile-image-hero-2.jpg',
            },
            {
                id: 2,
                title: 'Manufactured with the best materials',
                description: `Our modern furniture store provide a high level of quality. Our company has invested in advanced technology to ensure that every product is made as perfect and as consistent as possible. With three decades of experience in this industry, we understand what customers want for their home and office.`,
                desktopImage: './images/desktop-image-hero-3.jpg',
                mobileImage: './images/mobile-image-hero-3.jpg',
            },
        ];

        // ---------- SVG COMPONENTS ----------
        // SVG Logo persis sesuai desain "room"
        const Logo = () => (
    <img src="./images/logo.svg" alt="room logo" className="h-3.5 w-auto" />
);

        const ArrowRight = () => (
            <svg width="40" height="12" viewBox="0 0 40 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M34.5 0L40 6L34.5 12" stroke="currentColor" strokeWidth="2" />
                <path d="M0 6H39" stroke="currentColor" strokeWidth="2" />
            </svg>
        );

        const AngleLeft = () => (
            <svg width="14" height="24" viewBox="0 0 14 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M13 0.999999L1.00001 12L13 23" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
            </svg>
        );

        const AngleRight = () => (
            <svg width="14" height="24" viewBox="0 0 14 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 0.999999L13 12L1 23" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
            </svg>
        );

        const Hamburger = () => (
            <svg width="20" height="14" viewBox="0 0 20 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="20" height="2" fill="white" />
                <rect y="6" width="20" height="2" fill="white" />
                <rect y="12" width="20" height="2" fill="white" />
            </svg>
        );

        const CloseIcon = () => (
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="1.63623" y="0.222168" width="20" height="2" transform="rotate(45 1.63623 0.222168)" fill="#A1A1A1" />
                <rect x="0.222168" y="14.3638" width="20" height="2" transform="rotate(-45 0.222168 14.3638)" fill="#A1A1A1" />
            </svg>
        );

        // ----- HEADER -----
        const Header = ({ isMenuOpen, toggleMenu, closeMenu }) => {
            return (
                <header className="site-header">
                    <button
                        className="hamburger-btn"
                        onClick={toggleMenu}
                        aria-expanded={isMenuOpen}
                        aria-label="Toggle menu"
                    >
                        <Hamburger />
                    </button>

                    <a href="#" className="logo-link" aria-label="Room homepage">
                        <Logo />
                    </a>

                    <nav className="desktop-nav" aria-label="Main navigation">
                        <ul>
                            {['home', 'shop', 'about', 'contact'].map((item) => (
                                <li key={item}>
                                    <a href="#">{item}</a>
                                </li>
                            ))}
                        </ul>
                    </nav>

                    {/* Mobile Navigation */}
                    <div className={`mobile-nav ${isMenuOpen ? 'open' : ''}`}>
                        <button onClick={closeMenu} aria-label="Close menu">
                            <CloseIcon />
                        </button>

                        <ul>
                            <li><a href="#" onClick={closeMenu}>home</a></li>
                            <li><a href="#" onClick={closeMenu}>shop</a></li>
                            <li><a href="#" onClick={closeMenu}>about</a></li>
                            <li><a href="#" onClick={closeMenu}>contact</a></li>
                        </ul>
                    </div>

                    <div
                        className={`mobile-backdrop ${isMenuOpen ? 'open' : ''}`}
                        onClick={closeMenu}
                    ></div>
                </header>
            );
        };

        // ----- HERO SECTION -----
        const Hero = ({ slides, currentIndex, nextSlide, prevSlide }) => {
            const current = slides[currentIndex];

            return (
                <section className="hero-section" aria-label="Featured products">
                    <div className="hero-image-wrapper">
                        {slides.map((slide, idx) => (
                            <div
                                key={slide.id}
                                className={`slide-item ${idx === currentIndex ? 'active' : ''}`}
                            >
                                <picture>
                                    <source media="(min-width: 1025px)" srcSet={slide.desktopImage} />
                                    <img src={slide.mobileImage} alt={slide.title} />
                                </picture>
                            </div>
                        ))}

                        {/* Nav Buttons (Mobile Position) */}
                        <div className="slider-controls slider-controls-mobile" role="group" aria-label="Slider controls">
                            <button onClick={prevSlide} className="slider-btn" aria-label="Previous slide">
                                <AngleLeft />
                            </button>
                            <button onClick={nextSlide} className="slider-btn" aria-label="Next slide">
                                <AngleRight />
                            </button>
                        </div>
                    </div>

                    <div className="hero-content">
                        <div className="hero-text-box">
                            <h1 className="hero-title">{current.title}</h1>
                            <p className="hero-description">{current.description}</p>
                            <a href="#" className="shop-link">
                                Shop now
                                <ArrowRight />
                            </a>
                        </div>

                        {/* Nav Buttons (Desktop Position: Pojok Kiri Bawah Teks) */}
                        <div className="slider-controls slider-controls-desktop" role="group" aria-label="Slider controls">
                            <button onClick={prevSlide} className="slider-btn" aria-label="Previous slide">
                                <AngleLeft />
                            </button>
                            <button onClick={nextSlide} className="slider-btn" aria-label="Next slide">
                                <AngleRight />
                            </button>
                        </div>
                    </div>
                </section>
            );
        };

        // ----- ABOUT SECTION -----
        const About = () => (
            <section className="about-section" aria-labelledby="about-heading">
                <div className="about-img-container">
                    <img src="./images/image-about-dark.jpg" alt="Dark wooden chairs" />
                </div>

                <div className="about-content">
                    <h2 id="about-heading" className="about-title">
                        About our furniture
                    </h2>
                    <p className="about-description">
                        Our multifunctional collection blends design and function to suit your individual taste.
                        Make each room unique, or pick a cohesive theme that best express your interests and what
                        inspires you. Find the furniture pieces you need, from traditional to contemporary styles
                        or anything in between. Product specialists are available to help you create your dream space.
                    </p>
                </div>

                <div className="about-img-container">
                    <img src="./images/image-about-light.jpg" alt="White chair in a bright room" />
                </div>
            </section>
        );

        // ----- FOOTER -----
        const Footer = () => (
            <footer className="site-footer">
                <p>
                    Challenge by{' '}
                    <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">
                        Frontend Mentor
                    </a>
                    . Coded by{' '}
                    <a href="https://www.frontendmentor.io/profile/rarifingerstyle-svg">
                        Ahmad Asrari
                    </a>
                    .
                </p>
            </footer>
        );

        // ----- MAIN APP -----
        const App = () => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const totalSlides = slidesData.length;

            const goToSlide = useCallback((index) => {
                let newIndex = index;
                if (newIndex < 0) newIndex = totalSlides - 1;
                if (newIndex >= totalSlides) newIndex = 0;
                setCurrentIndex(newIndex);
            }, [totalSlides]);

            const nextSlide = () => goToSlide(currentIndex + 1);
            const prevSlide = () => goToSlide(currentIndex - 1);

            const toggleMenu = () => setIsMenuOpen((prev) => !prev);
            closeMenu = () => setIsMenuOpen(false);

            // Navigasi Keyboard Panah Left & Right
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight') nextSlide();
                    if (e.key === 'ArrowLeft') prevSlide();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [currentIndex]);

            return (
                <div className="app-container">
                    <div>
                        <Header isMenuOpen={isMenuOpen} toggleMenu={toggleMenu} closeMenu={closeMenu} />
                        <main>
                            <Hero
                                slides={slidesData}
                                currentIndex={currentIndex}
                                nextSlide={nextSlide}
                                prevSlide={prevSlide}
                            />
                            <About />
                        </main>
                    </div>
                    <Footer />
                </div>
            );
        };

        // RENDER
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
